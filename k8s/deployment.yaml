apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-ml-app
  namespace: default
  labels:
    app: weather-ml-app
spec:
  replicas: 3              # several pods so one can be replaced while the others serve traffic
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # start one extra new pod during an update
      maxUnavailable: 0    # never drop below the desired number of running pods
  selector:
    matchLabels:
      app: weather-ml-app
  template:
    metadata:
      labels:
        app: weather-ml-app
    spec:
      containers:
        - name: weather-ml-app
          # Image name and version. CI builds and pushes this exact tag, and CD deploys it.
          # To release a new version, change the tag here (e.g. v1 -> v2) and push.
          image: cammyjwils/weather-ml-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:    # only send traffic to a pod once Flask is answering
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
