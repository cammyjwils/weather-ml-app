name: CI

# (a) Detect changes: run on every push to main (and allow a manual run from the Actions tab)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9 (same version as the Docker image)
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # (b) Install Flask and the dependencies in requirements.txt
      - name: Install Flask and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask
          pip install -r requirements.txt

      # (c) Run each test file in its own step, in order
      - name: Run smoke test
        run: python -m unittest -v tests.smoke_test

      - name: Run unit test
        run: python -m unittest -v tests.unit_test

      - name: Run integration test
        run: python -m unittest -v tests.integration_test

      # The image name and version (e.g. cammyjwils/weather-ml-app:v2) are read from
      # k8s/deployment.yaml, so CI builds exactly the image that CD will deploy.
      - name: Read image name and version from k8s/deployment.yaml
        id: image
        run: |
          IMAGE=$(grep -m1 'image:' k8s/deployment.yaml | awk '{print $2}')
          echo "Image to build: $IMAGE"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      # Docker is pre-installed on GitHub's ubuntu-latest runners
      - name: Check Docker is available
        run: docker version

      # (d) Build a Docker image from the Dockerfile
      - name: Build Docker image
        run: docker build -t ${{ steps.image.outputs.name }} .

      # (e) Build test: launch a container and run a command inside it
      - name: Test a container can be launched from the image
        run: |
          docker run -d --name weather-test -p 5000:5000 ${{ steps.image.outputs.name }}
          sleep 10
          docker ps --filter name=weather-test
          docker exec weather-test python -c "import flask, sklearn; print('Container is running: Flask', flask.__version__, '| scikit-learn', sklearn.__version__)"
          docker logs weather-test
          docker rm -f weather-test

      # (f) Push the image to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to DockerHub
        run: docker push ${{ steps.image.outputs.name }}
