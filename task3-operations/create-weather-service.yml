---
# Task 3(d): Create a Service for the application
# NodePort service: port 5000 inside the cluster, reachable on <minikube ip>:30080
- name: Create Weather ML App Kubernetes Service
  hosts: localhost
  connection: local
  become: false

  tasks:
    - name: Expose the weather app using the NodePort service in k8s/service.yaml
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/../k8s/service.yaml"

    - name: Get the service details
      command: kubectl get service weather-ml-app-service
      register: svc
      changed_when: false

    - name: Display the service details
      debug:
        var: svc.stdout_lines
