---
- name: Create Weather ML App Kubernetes Service
  hosts: localhost
  connection: local
  become: false

  tasks:
    - name: Expose weather app using NodePort service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: weather-ml-app-service
            namespace: default
          spec:
            type: NodePort
            selector:
              app: weather-ml-app
            ports:
              - protocol: TCP
                port: 5000
                targetPort: 5000
                nodePort: 30080
