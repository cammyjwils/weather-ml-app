---
- name: Deploy Weather ML App to Kubernetes
  hosts: localhost
  connection: local
  become: false

  tasks:
    - name: Create weather app deployment
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: weather-ml-app
            namespace: default
          spec:
            replicas: 2
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
            selector:
              matchLabels:
                app: weather-ml-app
            template:
              metadata:
                labels:
                  app: weather-ml-app
              spec:
                containers:
                  - name: weather-ml-app
                    image: pszmid300/weather-ml-app:latest
                    imagePullPolicy: Always
                    ports:
                      - containerPort: 5000
                    readinessProbe:
                      httpGet:
                        path: /
                        port: 5000
                      initialDelaySeconds: 5
                      periodSeconds: 5
